version: 2

models:
  - name: dim_institution
    description: "Dimension table containing institution information including name, city, and state"
    columns:
      - name: unitid
        description: "Unique identifier for the institution"
        tests:
          - not_null
          - unique
      - name: institution_name
        description: "Name of the institution"
        tests:
          - not_null
      - name: city
        description: "City where the institution is located"
        tests:
          - not_null
      - name: state_abbr
        description: "State abbreviation where the institution is located"
        tests:
          - not_null

